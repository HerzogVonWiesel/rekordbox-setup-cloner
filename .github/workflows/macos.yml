name: macOS and Windows builds and releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to publish (leave empty for a build only)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.release_tag == '' }}

jobs:
  build:
    name: Universal Mac app
    runs-on: macos-15
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Read and validate version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Info.plist must contain a three-part version number.' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'The release tag must match CFBundleShortVersionString in Resources/Info.plist.' >&2
            exit 1
          fi
          if [[ -n "$REQUESTED_TAG" && "$REQUESTED_TAG" != "v$version" ]]; then
            echo 'The requested release tag must match the checked-out app version.' >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      # Compile/package only: never start the application or run application tests.
      - name: Build app and release archive
        run: bash scripts/package-release.sh

      - name: Check binary architectures and ad-hoc signature
        run: |
          xcrun lipo 'dist/Rekordbox Setup Cloner.app/Contents/MacOS/RekordboxSetupCloner' -verify_arch arm64 x86_64
          codesign --verify --deep --strict 'dist/Rekordbox Setup Cloner.app'

      - name: Upload downloadable build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Rekordbox-Setup-Cloner-v${{ steps.version.outputs.version }}-macos-universal
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  windows:
    name: Windows x64 app
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Read and validate version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          [xml]$plist = Get-Content Resources/Info.plist -Raw
          $version = $plist.SelectSingleNode('/plist/dict/key[text()="CFBundleShortVersionString"]/following-sibling::string[1]').InnerText
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid app version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match the app version.' }
          if ($env:REQUESTED_TAG -and $env:REQUESTED_TAG -ne "v$version") { throw 'Requested tag must match the app version.' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify Windows logic with isolated synthetic settings
        shell: pwsh
        run: dotnet run --project Windows/RekordboxSetupCloner.Tests -c Release

      - name: Build portable app and release archive
        shell: pwsh
        run: ./scripts/package-windows-release.ps1

      - name: Upload downloadable Windows build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Rekordbox-Setup-Cloner-v${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/release/*-windows-x64.zip
            dist/release/SHA256SUMS-windows-x64.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish tagged release
    if: (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [build, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download built archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Rekordbox-Setup-Cloner-v${{ needs.build.outputs.version }}-macos-universal
          path: release

      - name: Download Windows archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Rekordbox-Setup-Cloner-v${{ needs.windows.outputs.version }}-windows-x64
          path: release

      - name: Create release and attach archive/checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          Take your rekordbox preferences to another computer, then restore the host's setup afterwards.

          - **macOS 13+ (Apple Silicon & Intel):** download the macos-universal.zip asset, extract it,
            and move Rekordbox Setup Cloner.app to Applications.
          - **Windows 10/11 x64:** download the windows-x64.zip asset, extract it,
            and run RekordboxSetupCloner.exe. No installer or separate .NET runtime needed.

          Quit rekordbox before saving, importing, copying Pad FX, or restoring settings.
          See the README for usage. SHA256SUMS.txt and SHA256SUMS-windows-x64.txt contain the download checksums.
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # A rerun only fills in missing uploads; published assets are not overwritten.
            for asset in release/*; do
              name=$(basename "$asset")
              if ! gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
                gh release upload "$RELEASE_TAG" "$asset"
              fi
            done
          else
            gh release create "$RELEASE_TAG" release/* \
              --verify-tag \
              --title "Rekordbox Setup Cloner $RELEASE_TAG" \
              --notes-file release-notes.md --generate-notes
          fi
